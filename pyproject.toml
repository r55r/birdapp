[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "birdapp"
version = "0.1.0"
description = "A CLI tool for querying Twitter data and importing archives using the TwitterAPI.io API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",
    "platformdirs>=4.3.6",
    "sqlmodel>=0.0.31",
]

[project.scripts]
birdapp = "birdapp.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "ty>=0.0.13",
    "types-requests>=2.32.4.20250809",
]
